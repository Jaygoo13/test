<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="골프달력">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>골프 스코어 달력</title>
<style>
:root{
  --bg:#f3f5f2; --card:#ffffff; --text:#18211d; --muted:#6b756f; --line:#e1e6e2;
  --accent:#1f6f4a; --accent-soft:#e3f1e8; --accent-text:#ffffff;
  --blue:#2d63a3; --par-row:#eef3fa;
  --eg-bg:#f5d77a; --eg-fg:#5a4300;
  --bd-bg:#fbd9d9; --bd-fg:#b42323;
  --bg-bg:#e3ecf8; --bg-fg:#2b4f86;
  --db-bg:#c9d9f1; --db-fg:#1d3e72;
  --tp-bg:#9fb8e3; --tp-fg:#0f2a57;
  --warn:#d9480f; --warn-soft:#fff1e6; --ok:#2b8a3e;
  --sun:#d64545; --sat:#2d63a3;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101412; --card:#1a201d; --text:#e7ece9; --muted:#97a19b; --line:#2b3430;
    --accent:#3fa874; --accent-soft:#1d3327; --accent-text:#08140e;
    --blue:#5b8fd1; --par-row:#1c2633;
    --eg-bg:#6b5310; --eg-fg:#ffe7a1;
    --bd-bg:#5a2222; --bd-fg:#ffb3b3;
    --bg-bg:#1f2f47; --bg-fg:#b8cff2;
    --db-bg:#2a3f63; --db-fg:#d3e2fa;
    --tp-bg:#3a5687; --tp-fg:#eef4ff;
    --warn:#ff8a4c; --warn-soft:#3a2416; --ok:#69db7c;
    --sun:#ff8080; --sat:#7fb0ef;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#101412; --card:#1a201d; --text:#e7ece9; --muted:#97a19b; --line:#2b3430;
  --accent:#3fa874; --accent-soft:#1d3327; --accent-text:#08140e;
  --blue:#5b8fd1; --par-row:#1c2633;
  --eg-bg:#6b5310; --eg-fg:#ffe7a1; --bd-bg:#5a2222; --bd-fg:#ffb3b3;
  --bg-bg:#1f2f47; --bg-fg:#b8cff2; --db-bg:#2a3f63; --db-fg:#d3e2fa;
  --tp-bg:#3a5687; --tp-fg:#eef4ff; --warn:#ff8a4c; --warn-soft:#3a2416; --ok:#69db7c;
  --sun:#ff8080; --sat:#7fb0ef; --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px;line-height:1.4;min-height:100vh;
  padding-bottom:calc(90px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.hidden{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:8px}
.top h1{font-size:19px;margin:0;flex:1;font-weight:700;letter-spacing:-.3px;text-align:center}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:20px}
.icon-btn:active{background:var(--line)}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;margin-top:8px}
.seg button{flex:1;padding:6px 0;border-radius:8px;font-size:14px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.sub-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:13px;color:var(--muted)}
.pill{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--text);background:var(--card)}

main{padding:12px 16px}

/* month */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px}
.wk div{text-align:center;font-size:12px;color:var(--muted);font-weight:600}
.wk div:first-child{color:var(--sun)} .wk div:last-child{color:var(--sat)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cell{background:var(--card);border-radius:8px;min-height:86px;padding:3px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;overflow:hidden;text-align:center;border:1px solid transparent}
.cell.out{opacity:.35}
.cell.today{border-color:var(--accent)}
.cell.sel{background:var(--accent-soft)}
.cell .dn{font-size:12px;font-weight:600;align-self:flex-start;padding-left:3px}
.cell.sun .dn{color:var(--sun)} .cell.sat .dn{color:var(--sat)}
.cell .club{font-size:9.5px;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.cell .tm{font-size:9px;color:var(--muted)}
.cell .me{font-size:17px;font-weight:800;color:var(--accent);line-height:1.1}
.cell .co{font-size:8.5px;color:var(--muted);line-height:1.15;word-break:break-all}
.cell .more{font-size:9px;color:var(--accent);font-weight:700}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--card);border-radius:12px;padding:10px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--muted)}

/* day */
.empty{text-align:center;color:var(--muted);padding:40px 0}
.round{background:var(--card);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.round-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.round-head h2{margin:0;font-size:18px}
.round-head .meta{color:var(--muted);font-size:13px}
.big-score{font-size:34px;font-weight:800;color:var(--accent);line-height:1}
.big-score small{font-size:13px;color:var(--muted);font-weight:600;display:block;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.chip{background:var(--bg);border-radius:999px;padding:3px 10px;font-size:13px}
.chip.me{background:var(--accent-soft);font-weight:700}
.sc-wrap{overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch}
table.sc{border-collapse:collapse;width:100%;font-size:13px;min-width:330px}
table.sc th,table.sc td{padding:5px 1px;text-align:center;border-bottom:1px solid var(--line)}
table.sc thead th{background:var(--blue);color:#fff;font-weight:600}
table.sc thead th:first-child{border-top-left-radius:6px} table.sc thead th:last-child{border-top-right-radius:6px}
table.sc tr.par td{background:var(--par-row);color:var(--muted);font-weight:600}
table.sc td.nm{text-align:left;padding-left:4px;white-space:nowrap;max-width:64px;overflow:hidden;text-overflow:ellipsis;font-weight:600}
table.sc tr.me td.nm{color:var(--accent)}
table.sc td.tot{font-weight:800}
.s{display:inline-block;min-width:22px;padding:1px 2px;border-radius:5px}
.eg{background:var(--eg-bg);color:var(--eg-fg);font-weight:700}
.bd{background:var(--bd-bg);color:var(--bd-fg);font-weight:700}
.bg{background:var(--bg-bg);color:var(--bg-fg)}
.db{background:var(--db-bg);color:var(--db-fg)}
.tp{background:var(--tp-bg);color:var(--tp-fg)}
.round-actions{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:10px;border-radius:10px;background:var(--bg);font-weight:600;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-text)}
.btn.danger{color:var(--warn)}
.memo{margin-top:8px;font-size:13px;color:var(--muted);white-space:pre-wrap}
details.img summary{font-size:13px;color:var(--muted);margin-top:10px;cursor:pointer}
details.img img{width:100%;border-radius:8px;margin-top:6px}

/* fab */
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-text);font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:30;display:grid;place-items:center}

/* sheets */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
.menu{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:41;display:flex;flex-direction:column;gap:8px}
.menu button{background:var(--card);padding:16px;border-radius:14px;font-size:16px;font-weight:600;text-align:left}
.menu button small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.sheet-head h3{margin:0;font-size:17px}
.sheet-head button{padding:6px 10px;font-size:16px;color:var(--accent);font-weight:600}
.sheet-body{flex:1;overflow-y:auto;padding:14px 16px calc(30px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:var(--card);border-radius:12px;padding:12px;margin-bottom:14px}
.box h4{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.notice{background:var(--warn-soft);color:var(--text);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.notice.ok{background:var(--accent-soft)}
.pl{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.pl input[type=text]{flex:1}
.pl .me-tg{white-space:nowrap;font-size:13px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);color:var(--muted)}
.pl .me-tg.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:700}
.pl .x{width:34px;height:38px;color:var(--muted);font-size:18px}
.link{color:var(--accent);font-weight:600;font-size:14px}
.ed-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
table.ed{border-collapse:separate;border-spacing:2px;font-size:12px}
table.ed th{color:var(--muted);font-weight:600;padding:2px 0}
table.ed td.nm{position:sticky;left:0;background:var(--card);font-weight:600;font-size:12px;max-width:58px;min-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:4px;z-index:1}
table.ed input{width:34px;height:36px;padding:0;text-align:center;font-size:16px;border-radius:6px}
table.ed tr.par input{background:var(--par-row)}
table.ed input.warn{border-color:var(--warn);background:var(--warn-soft)}
table.ed td.t{min-width:40px;text-align:center;font-weight:800;font-size:14px}
.chk{font-size:11px;display:block;font-weight:600}
.chk.good{color:var(--ok)} .chk.bad{color:var(--warn)}
.mode{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}
.mode .seg{margin:0;flex:1}
.progress{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:24px}
.progress .pbox{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:340px;text-align:center}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:80;max-width:90vw;text-align:center}
.set-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:10px}
.set-item:last-child{border-bottom:0}
.set-item .d{font-size:12px;color:var(--muted)}
.set-item button{white-space:nowrap}
.help{font-size:13px;color:var(--muted);line-height:1.6}
/* stats */
:root{--d-under:#d64545;--d-par:#b3bab7;--d-b1:#6c9be0;--d-b2:#2f5fb0;--d-b3:#13285a;--bar-mute:#dfe5e1}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--d-under:#ff7b7b;--d-par:#6b7470;--d-b1:#2d58a8;--d-b2:#86aeea;--d-b3:#d6e4fb;--bar-mute:#2f3834}}
:root[data-theme="dark"]{--d-under:#ff7b7b;--d-par:#6b7470;--d-b1:#2d58a8;--d-b2:#86aeea;--d-b3:#d6e4fb;--bar-mute:#2f3834}
.chips-row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips-row::-webkit-scrollbar{display:none}
.ychip{flex:none;padding:7px 16px;border-radius:999px;background:var(--card);color:var(--muted);font-weight:700;font-size:14px;border:1px solid var(--line)}
.ychip.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.st{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.st h3{margin:0 0 12px;font-size:16px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.st h3 small{font-size:12px;color:var(--muted);font-weight:500}
.st .cap{font-size:12px;color:var(--muted);margin-top:8px}
details.st > summary{list-style:none;cursor:pointer}
details.st > summary::-webkit-details-marker{display:none}
details.st > summary h3{margin:0}
details.st[open] > summary h3{margin-bottom:12px}
details.st > summary h3::after{content:"⌄";color:var(--muted);font-size:18px;line-height:1}
details.st[open] > summary h3::after{content:"⌃"}
.hero{text-align:center;padding:6px 0 12px}
.hero .who{font-size:14px;color:var(--muted)}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1.15}
.hero .big small{font-size:16px;font-weight:600;letter-spacing:0}
.mm{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch;margin-top:10px}
.mm .lbl{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
.mm .gap{align-self:center;background:var(--accent-soft);color:var(--accent);font-weight:800;border-radius:999px;padding:6px 10px;font-size:14px;white-space:nowrap}
.mmc{background:var(--bg);border-radius:12px;padding:10px 12px;text-align:left}
.mmc.r{text-align:right}
.mmc b{display:block;font-size:30px;line-height:1.1}
.mmc .club{font-size:13px;font-weight:700;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mmc .dt{font-size:12px;color:var(--muted)}
.vbars{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:end;height:190px;padding-top:24px}
.vb{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.vb .n{font-size:13px;font-weight:700}
.vb .tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--text);color:var(--card)}
.vb .bar{width:100%;max-width:44px;border-radius:8px 8px 4px 4px;background:var(--bar-mute);min-height:3px;display:flex;align-items:flex-end;justify-content:center}
.vb .bar.hi{background:var(--accent)}
.vb .bar span{font-size:10px;font-weight:700;color:var(--accent-text);padding-bottom:4px}
.vb .bar:not(.hi) span{color:var(--text)}
.vlab{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:6px;text-align:center;font-size:12px;color:var(--muted);font-weight:600}
.hb{display:grid;grid-template-columns:52px 1fr 58px;gap:10px;align-items:center;margin-bottom:10px;font-size:14px}
.hb .k{color:var(--muted);font-weight:700}
.hb .t{height:26px;border-radius:4px;background:var(--bg);overflow:hidden}
.hb .t i{display:flex;align-items:center;justify-content:flex-end;height:100%;background:var(--accent);border-radius:4px 8px 8px 4px;color:var(--accent-text);font-style:normal;font-weight:700;font-size:13px;padding-right:8px;min-width:26px}
.hb .v{text-align:right;font-weight:700}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:10px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--accent)}
.legend span.avg::before{background:transparent;border:2px solid var(--muted);width:6px;height:6px;border-radius:50%}
.line-wrap{position:relative}
.line-wrap svg{display:block;width:100%;height:auto;overflow:visible}
.line-wrap .tip{position:absolute;transform:translate(-50%,-110%);background:var(--text);color:var(--card);font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px;white-space:nowrap;pointer-events:none}
.stack{display:flex;gap:2px;height:22px;border-radius:6px;overflow:hidden;margin-bottom:12px}
.stack i{display:block;height:100%}
.dist-row{display:grid;grid-template-columns:14px 1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.dist-row:last-child{border-bottom:0}
.dist-row .dot{width:12px;height:12px;border-radius:4px}
.dist-row .pc{color:var(--muted);font-size:13px;min-width:42px;text-align:right}
.dist-row .ct{font-weight:800;min-width:36px;text-align:right}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tile{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.tile b{display:block;font-size:18px}
.tile span{font-size:11px;color:var(--muted)}
.rk{display:grid;grid-template-columns:20px 44px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.rk:last-child{border-bottom:0}
.rk .no{font-weight:800;font-style:italic;color:var(--muted);font-size:18px}
.rk .ini{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:17px}
.rk .m{min-width:0}
.rk .m .d{font-size:12px;color:var(--muted)}
.rk .m .c{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .r{text-align:right}
.rk .r .s{font-size:12px;color:var(--muted)}
.rk .r .x{font-size:18px;font-weight:800;color:var(--accent)}
.rk .r .x.plain{color:var(--text)}
.best{border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;width:100%;text-align:left;display:block}
.best.life{border-color:var(--accent)}
.best .btop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.best .crs{font-size:12px;color:var(--muted)}
.best .club{font-size:17px;font-weight:800}
.best .sc{background:var(--accent);color:var(--accent-text);font-size:24px;font-weight:800;border-radius:12px;min-width:56px;padding:8px;text-align:center}
.best .badge{display:inline-block;font-size:11px;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 8px;margin-bottom:4px}
.best .meta{font-size:13px;color:var(--muted);margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.morebtn{width:100%;padding:10px;color:var(--accent);font-weight:700;font-size:14px}

</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <button class="icon-btn" id="prev" aria-label="이전">‹</button>
    <h1 id="title"></h1>
    <button class="icon-btn" id="next" aria-label="다음">›</button>
  </div>
  <div class="sub-row">
    <button class="pill" id="todayBtn">오늘</button>
    <div class="seg" style="margin:0;width:200px" id="viewSeg">
      <button data-v="month">월간</button><button data-v="day">일간</button><button data-v="stats">통계</button>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="설정"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</header>
<main id="main"></main>
<button class="fab" id="fab" aria-label="기록 추가">＋</button>
<input type="file" id="fileIn" accept="image/*" multiple class="hidden">
<input type="file" id="importIn" accept="application/json,.json" class="hidden">
<div id="layer"></div>

<script>
'use strict';
/* ================= utils ================= */
const $ = (s, el = document) => el.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const sum = a => a.reduce((s, v) => s + (v == null || isNaN(v) ? 0 : +v), 0);
const clone = o => JSON.parse(JSON.stringify(o));
const normLogo = s => String(s || '').toLowerCase().replace(/[^a-z0-9가-힣]/g, '');
function similarity(a, b) { // 1 - normalized Levenshtein distance
  if (!a || !b) return 0; const m = a.length, n = b.length; let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return 1 - prev[n] / Math.max(m, n);
}
// stored scorecard copy: 600px wide, grayscale, JPEG 0.5 (~60KB) — enough to read the numbers
function shrinkImage(img) {
  const w = Math.min(600, img.naturalWidth || img.width), h = Math.round((img.naturalHeight || img.height) * w / (img.naturalWidth || img.width));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h), p = d.data;
  for (let i = 0; i < p.length; i += 4) { const l = (p[i] * 299 + p[i + 1] * 587 + p[i + 2] * 114) / 1000; p[i] = p[i + 1] = p[i + 2] = l; }
  x.putImageData(d, 0, 0); return c.toDataURL('image/jpeg', 0.5);
}
const dataUrlKB = u => u ? Math.round(u.length * 0.75 / 1024) : 0;
const loadDataUrl = u => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = u; });
const normName = s => String(s || '').replace(/[\s*＊·.]/g, '').toLowerCase();
function toast(msg, ms = 2400) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
function diffClass(d) {
  if (d == null || isNaN(d)) return '';
  if (d <= -2) return 'eg'; if (d === -1) return 'bd'; if (d === 0) return '';
  if (d === 1) return 'bg'; if (d === 2) return 'db'; return 'tp';
}
const fmtDiff = d => d > 0 ? `+${d}` : d === 0 ? 'E' : String(d);

/* ================= storage (IndexedDB) ================= */
const DB = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('golf-score-calendar', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('rounds', { keyPath: 'id' }); d.createObjectStore('kv'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (store, mode, fn) => {
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode); const req = fn(t.objectStore(store));
      t.oncomplete = () => res(req ? req.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  };
  return {
    all: () => tx('rounds', 'readonly', s => s.getAll()),
    put: r => tx('rounds', 'readwrite', s => s.put(r)),
    del: id => tx('rounds', 'readwrite', s => s.delete(id)),
    clear: () => tx('rounds', 'readwrite', s => s.clear()),
    get: k => tx('kv', 'readonly', s => s.get(k)),
    set: (k, v) => tx('kv', 'readwrite', s => s.put(v, k)),
  };
})();

/* ================= state & model ================= */
const S = {
  view: 'month', cursor: new Date(), selected: ymd(new Date()),
  rounds: [], settings: { myName: '' }, clubMap: {}, statYear: 'all', clubAll: false,
};
const meIdx = r => { const i = r.players.findIndex(p => p.me); return i < 0 ? 0 : i; };
const parTotal = r => sum(r.courses.flatMap(c => c.par));
function playerTotal(r, pi) { return sum(r.players[pi].scores.flat()); }
function playedPar(r, pi) { // par of holes actually filled in
  let t = 0; r.courses.forEach((c, ci) => c.par.forEach((p, h) => { if (r.players[pi].scores[ci]?.[h] != null) t += +p || 0; })); return t;
}
const roundsOn = date => S.rounds.filter(r => r.date === date).sort((a, b) => (a.time || '').localeCompare(b.time || ''));
async function loadAll() {
  try { S.rounds = await DB.all(); } catch (e) { S.rounds = []; toast('저장소를 열 수 없습니다: ' + e.message, 4000); }
  try { Object.assign(S.settings, (await DB.get('settings')) || {}); } catch (e) {}
  try { S.clubMap = (await DB.get('clubMap')) || {}; } catch (e) {}
  try { const v = await DB.get('ui'); if (v && v.view) S.view = v.view; } catch (e) {}
}
const saveUi = () => DB.set('ui', { view: S.view }).catch(() => {});

/* ================= rendering ================= */
function render() {
  document.querySelectorAll('#viewSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === S.view));
  const st = S.view === 'stats';
  ['#prev', '#next', '#todayBtn'].forEach(q => $(q).style.visibility = st ? 'hidden' : '');
  if (S.view === 'month') renderMonth(); else if (st) renderStats(); else renderDay();
}
function renderMonth() {
  const y = S.cursor.getFullYear(), m = S.cursor.getMonth();
  $('#title').textContent = `${y}년 ${m + 1}월`;
  const first = new Date(y, m, 1), start = new Date(y, m, 1 - first.getDay());
  const last = new Date(y, m + 1, 0);
  const weeks = Math.ceil((first.getDay() + last.getDate()) / 7);
  const today = ymd(new Date());
  let h = '<div class="wk">' + DOW.map(d => `<div>${d}</div>`).join('') + '</div><div class="grid">';
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i), ds = ymd(d);
    const rs = roundsOn(ds);
    const cls = ['cell', d.getMonth() !== m && 'out', ds === today && 'today', ds === S.selected && 'sel', d.getDay() === 0 && 'sun', d.getDay() === 6 && 'sat'].filter(Boolean).join(' ');
    let inner = `<span class="dn">${d.getDate()}</span>`;
    if (rs.length) {
      const r = rs[0], mi = meIdx(r);
      const co = r.players.map((p, i) => i === mi ? null : playerTotal(r, i)).filter(v => v);
      inner += `<span class="club">${esc(r.club || '골프장')}</span>` +
        (r.time ? `<span class="tm">${esc(r.time)}</span>` : '') +
        `<span class="me">${playerTotal(r, mi) || '-'}</span>` +
        (co.length ? `<span class="co">${co.join('·')}</span>` : '') +
        (rs.length > 1 ? `<span class="more">+${rs.length - 1}</span>` : '');
    }
    h += `<button class="${cls}" data-date="${ds}">${inner}</button>`;
  }
  h += '</div>';
  // month summary (my scores)
  const mk = `${y}-${pad(m + 1)}`;
  const mine = S.rounds.filter(r => r.date.startsWith(mk)).map(r => playerTotal(r, meIdx(r))).filter(v => v > 0);
  const full = S.rounds.filter(r => r.date.startsWith(mk) && r.courses.length >= 2).map(r => playerTotal(r, meIdx(r))).filter(v => v > 0);
  h += `<div class="summary">
    <div class="stat"><b>${mine.length}</b><span>라운드</span></div>
    <div class="stat"><b>${full.length ? (sum(full) / full.length).toFixed(1) : '-'}</b><span>평균 타수</span></div>
    <div class="stat"><b>${full.length ? Math.min(...full) : '-'}</b><span>베스트</span></div></div>`;
  $('#main').innerHTML = h;
}
// day-view scorecard in the card's own style: holes as +/- vs par (0 = par), totals as strokes
function scoreTable(r) {
  const mi = meIdx(r), nc = r.courses.length;
  return r.courses.map((c, ci) => {
    const n = c.par.length, last = nc > 1 && ci === nc - 1;
    let t = `<div class="sc-wrap"><table class="sc"><thead><tr><th>${esc(c.name || `코스${ci + 1}`)}</th>`;
    for (let h = 0; h < n; h++) t += `<th>${h + 1}</th>`;
    t += `<th${last ? ' colspan="2"' : ''}>TOTAL</th></tr></thead><tbody><tr class="par"><td class="nm">PAR</td>${c.par.map(p => `<td>${p ?? ''}</td>`).join('')}<td>${sum(c.par)}</td>${last ? `<td>${parTotal(r)}</td>` : ''}</tr>`;
    r.players.forEach((p, pi) => {
      const sc = p.scores[ci] || [];
      t += `<tr class="${pi === mi ? 'me' : ''}"><td class="nm">${esc(p.name || '-')}</td>`;
      for (let h = 0; h < n; h++) {
        const v = sc[h], d = v == null || c.par[h] == null ? null : v - c.par[h];
        t += `<td>${d == null ? '' : `<span class="s ${diffClass(d)}">${d}</span>`}</td>`;
      }
      t += `<td class="tot">${sum(sc) || ''}</td>${last ? `<td class="tot">${playerTotal(r, pi) || ''}</td>` : ''}</tr>`;
    });
    return t + '</tbody></table></div>';
  }).join('');
}
function renderDay() {
  const d = parseYmd(S.selected);
  $('#title').textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`;
  const rs = roundsOn(S.selected);
  if (!rs.length) {
    $('#main').innerHTML = `<div class="empty">이 날의 기록이 없습니다.<br><br><button class="btn primary" style="flex:none;padding:10px 20px" data-act="add">＋ 기록 추가</button></div>`;
    return;
  }
  $('#main').innerHTML = rs.map(r => {
    const mi = meIdx(r), tot = playerTotal(r, mi), dif = tot - playedPar(r, mi);
    const chips = r.players.map((p, i) => {
      const t = playerTotal(r, i); if (!t) return '';
      return `<span class="chip ${i === mi ? 'me' : ''}">${esc(p.name || '-')} ${t} (${fmtDiff(t - playedPar(r, i))})</span>`;
    }).join('');
    return `<article class="round">
      <div class="round-head">
        <div><h2>${esc(r.club || '골프장 미입력')}</h2>
          <div class="meta">${r.time ? '티업 ' + esc(r.time) : '티업 시간 없음'}${r.courses.length ? ' · ' + r.courses.map(c => esc(c.name)).filter(Boolean).join(' / ') : ''}</div></div>
        <div class="big-score">${tot || '-'}<small>${tot ? fmtDiff(dif) : ''}</small></div>
      </div>
      <div class="chips">${chips}</div>
      ${scoreTable(r)}
      ${r.memo ? `<div class="memo">${esc(r.memo)}</div>` : ''}
      ${r.image ? `<details class="img"><summary>스코어카드 이미지 보기</summary><img src="${r.image}" alt="스코어카드"></details>` : ''}
      <div class="round-actions">
        <button class="btn primary" data-act="edit" data-id="${r.id}">편집</button>
        <button class="btn danger" data-act="del" data-id="${r.id}">삭제</button>
      </div></article>`;
  }).join('');
}

/* ================= statistics ================= */
// my 18-hole total (rounds with fewer than 18 holes entered are left out of score stats)
const holesPlayed = r => r.players[meIdx(r)].scores.flat().filter(v => v != null).length;
const isFull = r => holesPlayed(r) >= 18;
const myTotal = r => playerTotal(r, meIdx(r));
const fmtDate = s => s.replace(/-/g, '.');
const avg = a => a.length ? sum(a) / a.length : null;
const fx = (v, d = 1) => v == null ? '-' : v.toFixed(d);
const SCORE_KINDS = [
  { k: 'under', label: '버디 이하', test: d => d <= -1 },
  { k: 'par', label: '파', test: d => d === 0 },
  { k: 'b1', label: '보기', test: d => d === 1 },
  { k: 'b2', label: '더블', test: d => d === 2 },
  { k: 'b3', label: '트리플 이상', test: d => d >= 3 },
];
function holeDiffs(r) { // my per-hole score minus par
  const p = r.players[meIdx(r)], out = [];
  r.courses.forEach((c, ci) => c.par.forEach((par, h) => { const v = p.scores[ci]?.[h]; if (v != null && par) out.push({ d: v - par, par, v }); }));
  return out;
}
const birdies = r => holeDiffs(r).filter(x => x.d <= -1).length;
const goDay = date => { S.selected = date; const d = parseYmd(date); S.cursor = new Date(d.getFullYear(), d.getMonth(), 1); S.view = 'day'; saveUi(); render(); window.scrollTo(0, 0); };

function renderStats() {
  $('#title').textContent = '통계';
  const all = S.rounds.slice().sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  if (!all.length) { $('#main').innerHTML = `<div class="empty">아직 기록이 없습니다.<br>스코어카드를 추가하면 통계가 표시됩니다.</div>`; return; }
  const years = [...new Set(all.map(r => r.date.slice(0, 4)))].sort().reverse();
  if (S.statYear !== 'all' && !years.includes(S.statYear)) S.statYear = 'all';
  const Y = S.statYear, scope = Y === 'all' ? all : all.filter(r => r.date.startsWith(Y));
  const full = scope.filter(isFull), allFull = all.filter(isFull);
  let h = `<div class="chips-row">${['all', ...years].map(y => `<button class="ychip ${y === Y ? 'on' : ''}" data-year="${y}">${y === 'all' ? '전체' : y}</button>`).join('')}</div>`;
  h += heroCard(all, allFull, full, Y);
  h += bucketCard(full);
  h += yearCard(all);
  h += trendCard(all, Y);
  h += monthCard(scope, Y);
  h += distCard(scope);
  h += birdieCard(scope);
  h += clubCard(full);
  h += bestCard(full, allFull);
  if (scope.length !== full.length) h += `<div class="cap" style="text-align:center;color:var(--muted);font-size:12px;margin-bottom:20px">18홀 미만 라운드 ${scope.length - full.length}건은 타수 통계에서 제외하고 홀별 분포에만 포함했습니다.</div>`;
  $('#main').innerHTML = h;
  wireLine();
}

function mmBlock(label, lo, hi) {
  if (!lo) return '';
  const cell = (r, side, kind) => `<button class="mmc ${side}" data-goto="${r.date}"><div class="lbl">${kind}</div><b>${myTotal(r)}</b><div class="club">${esc(r.club || '골프장 미입력')}</div><div class="dt">${fmtDate(r.date)} ›</div></button>`;
  return `<div class="lbl" style="font-size:13px;font-weight:700;margin:14px 0 0">${label}</div>
    <div class="mm">${cell(lo, '', '최저타수 ▼')}<span class="gap">+${myTotal(hi) - myTotal(lo)}타</span>${cell(hi, 'r', '최고타수 ▲')}</div>`;
}
function loHi(list) {
  if (!list.length) return [null, null];
  const s = list.slice().sort((a, b) => myTotal(a) - myTotal(b) || a.date.localeCompare(b.date));
  return [s[0], s[s.length - 1]];
}
function heroCard(all, allFull, full, Y) {
  const name = S.settings.myName || (all[0] && all[0].players[meIdx(all[0])].name) || '나';
  const y0 = +all[0].date.slice(0, 4), y1 = +all[all.length - 1].date.slice(0, 4), span = y1 - y0 + 1;
  const [lo, hi] = loHi(allFull), [ylo, yhi] = loHi(full);
  return `<section class="st"><div class="hero"><div class="who">${esc(name)}님은 ${span > 1 ? `${span}년 동안` : `${y0}년에`}</div>
    <div class="big">총 ${all.length}<small> 라운드</small></div>
    <div class="who">18홀 평균 <b style="color:var(--text)">${fx(avg(allFull.map(myTotal)), 2)}</b>타</div></div>
    ${mmBlock('전체 기간', lo, hi)}
    ${Y !== 'all' ? mmBlock(`${Y}년`, ylo, yhi) : ''}</section>`;
}
function bucketCard(full) {
  const B = [['~72', v => v <= 72], ['73~81', v => v >= 73 && v <= 81], ['82~90', v => v >= 82 && v <= 90], ['91~99', v => v >= 91 && v <= 99], ['100~', v => v >= 100]];
  const cnt = B.map(([, f]) => full.filter(r => f(myTotal(r))).length), n = full.length, mx = Math.max(...cnt, 1);
  const nz = cnt.filter(c => c > 0), maxC = Math.max(...cnt), minC = nz.length > 1 ? Math.min(...nz) : -1;
  return `<section class="st"><h3>라운드 타수별 분포 <small>18홀 ${n}라운드</small></h3>
    <div class="vbars">${cnt.map((c, i) => `<div class="vb" title="${B[i][0]}: ${c}라운드">
      ${c && c === maxC ? '<span class="tag">최다</span>' : c && c === minC ? '<span class="tag" style="background:var(--muted)">최소</span>' : ''}
      <span class="n">${c}${c && c / mx < 0.25 ? `<small style="color:var(--muted);font-weight:600"> · ${Math.round(c / Math.max(n, 1) * 100)}%</small>` : ''}</span>
      <div class="bar ${c && c === maxC ? 'hi' : ''}" style="height:${Math.max(2, c / mx * 100)}%">${c && c / mx >= 0.25 ? `<span>${Math.round(c / Math.max(n, 1) * 100)}%</span>` : ''}</div></div>`).join('')}</div>
    <div class="vlab">${B.map(b => `<span>${b[0]}</span>`).join('')}</div></section>`;
}
function yearCard(all) {
  const ys = [...new Set(all.map(r => r.date.slice(0, 4)))].sort().reverse();
  const rows = ys.map(y => { const rs = all.filter(r => r.date.startsWith(y)); return { y, n: rs.length, a: avg(rs.filter(isFull).map(myTotal)) }; });
  const mx = Math.max(...rows.map(r => r.n));
  return `<section class="st"><h3>연도별 라운드 수 & 평균 스코어</h3>
    <div class="legend"><span>라운드 수</span><span class="avg">18홀 평균</span></div>
    ${rows.map(r => `<div class="hb"><span class="k">${r.y}</span><div class="t"><i style="width:${r.n / mx * 100}%">${r.n}</i></div><span class="v">${fx(r.a, 2)}</span></div>`).join('')}</section>`;
}
function monthsFor(all, Y) { // [{key:'2026-03', label:'3월'}...]
  if (Y !== 'all') return Array.from({ length: 12 }, (_, i) => ({ key: `${Y}-${pad(i + 1)}`, label: `${i + 1}월` }));
  const last = parseYmd(all[all.length - 1].date), out = [];
  for (let i = 11; i >= 0; i--) { const d = new Date(last.getFullYear(), last.getMonth() - i, 1); out.push({ key: `${d.getFullYear()}-${pad(d.getMonth() + 1)}`, label: `${d.getMonth() + 1}월`, y: d.getFullYear() }); }
  return out;
}
function trendCard(all, Y) {
  const ms = monthsFor(all, Y).map(m => ({ ...m, a: avg(all.filter(r => r.date.startsWith(m.key) && isFull(r)).map(myTotal)) })).filter(m => m.a != null);
  if (ms.length < 2) return `<section class="st"><h3>한눈에 보는 스코어 <small>월 평균</small></h3><div class="cap">두 달 이상 기록이 쌓이면 추이 그래프가 표시됩니다.</div></section>`;
  const W = 340, H = 170, pl = 10, pr = 10, pt = 26, pb = 26;
  const lo = Math.min(...ms.map(m => m.a)), hi = Math.max(...ms.map(m => m.a)), padv = Math.max(1, (hi - lo) * 0.15);
  const y = v => pt + (v - (lo - padv)) / ((hi + padv) - (lo - padv)) * (H - pt - pb); // lower score = higher on chart
  const x = i => pl + (ms.length === 1 ? 0.5 : i / (ms.length - 1)) * (W - pl - pr);
  const pts = ms.map((m, i) => [x(i), y(m.a)]);
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join('');
  const area = `${path}L${pts[pts.length - 1][0].toFixed(1)},${H - pb}L${pts[0][0].toFixed(1)},${H - pb}Z`;
  const bi = ms.reduce((b, m, i) => m.a < ms[b].a ? i : b, 0), li = ms.length - 1;
  const grid = [0, 1, 2, 3].map(k => { const yy = pt + k * (H - pt - pb) / 3; return `<line x1="0" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`; }).join('');
  return `<section class="st"><h3>한눈에 보는 스코어 <small>월 평균 · 위로 갈수록 좋은 스코어</small></h3>
    <div class="line-wrap" id="lineWrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="월별 평균 스코어 추이">
      <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
      ${grid}<path d="${area}" fill="url(#ga)"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
      ${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>`).join('')}
      ${[...new Set([bi, li])].map(i => `<text x="${pts[i][0]}" y="${pts[i][1] - 10}" text-anchor="${i === li && li > 0 ? 'end' : 'middle'}" font-size="11" font-weight="700" fill="var(--text)">${i === bi ? '최고 ' : ''}${ms[i].a.toFixed(1)}</text>`).join('')}
      ${ms.map((m, i) => `<text x="${pts[i][0]}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--muted)">${m.label}</text>`).join('')}
      ${ms.map((m, i) => `<rect x="${pts[i][0] - 16}" y="0" width="32" height="${H}" fill="transparent" data-tip="${m.key.replace('-', '.')} · ${m.a.toFixed(2)}타" data-x="${pts[i][0] / W}" data-y="${pts[i][1] / H}"/>`).join('')}
    </svg></div></section>`;
}
function wireLine() {
  const w = document.getElementById('lineWrap'); if (!w) return;
  let tip = null;
  const show = el => {
    if (!el || !el.dataset.tip) return; if (!tip) { tip = document.createElement('div'); tip.className = 'tip'; w.appendChild(tip); }
    tip.textContent = el.dataset.tip; tip.style.left = (+el.dataset.x * 100) + '%'; tip.style.top = (+el.dataset.y * w.clientHeight) + 'px';
  };
  w.addEventListener('pointermove', e => show(e.target.closest('rect')));
  w.addEventListener('click', e => show(e.target.closest('rect')));
  w.addEventListener('pointerleave', () => { if (tip) { tip.remove(); tip = null; } });
}
function monthCard(scope, Y) {

  const mx = Math.max(...rows.map(r => r.n), 1);

}
function distCard(scope) {

    <div class="tiles">${pa.map((v, i) => `<div class="tile"><b>${fx(v, 2)}</b><span>파${i + 3} 평균 타수</span></div>`).join('')}</div>

function move(delta) {
  if (S.view === 'stats') return;
  if (S.view === 'month') { S.cursor = new Date(S.cursor.getFullYear(), S.cursor.getMonth() + delta, 1); }
  else { const d = parseYmd(S.selected); d.setDate(d.getDate() + delta); S.selected = ymd(d); S.cursor = new Date(d.getFullYear(), d.getMonth(), 1); }
  render();
}
$('#prev').onclick = () => move(-1);
$('#next').onclick = () => move(1);

$('#viewSeg').onclick = e => { const v = e.target.dataset.v; if (!v) return; S.view = v; saveUi(); render(); };
$('#main').addEventListener('click', async e => {
  const yc = e.target.closest('[data-year]'); if (yc) { S.statYear = yc.dataset.year; S.clubAll = false; render(); return; }
  if (e.target.closest('#clubMore')) { S.clubAll = !S.clubAll; render(); return; }
  const gt = e.target.closest('[data-goto]'); if (gt) { goDay(gt.dataset.goto); return; }
  const cell = e.target.closest('.cell');
  if (cell) {
    const ds = cell.dataset.date;
    if (S.selected === ds || roundsOn(ds).length) { S.selected = ds; S.view = 'day'; saveUi(); }
    else S.selected = ds;
    render(); return;
  }
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (b.dataset.act === 'add') openAddMenu();
  if (b.dataset.act === 'edit') openEditor(clone(S.rounds.find(r => r.id === b.dataset.id)));
  if (b.dataset.act === 'del') {
    if (!confirm('이 라운드 기록을 삭제할까요?')) return;
    await DB.del(b.dataset.id); S.rounds = S.rounds.filter(r => r.id !== b.dataset.id); render(); toast('삭제했습니다');
  }
});
// swipe left/right
(() => {
  let x0 = null, y0 = 0;
  $('#main').addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  $('#main').addEventListener('touchend', e => {

      if (card != null) chk = t === card ? `<span class="chk good">카드 ✓</span>` : `<span class="chk bad">카드 ${card}</span>`;
      el.innerHTML = (t || '') + chk;
    });
  });
  const g = $('#grand');
  if (g) g.innerHTML = `<h4>합계</h4>` + r.players.map((p, i) => {
    const t = playerTotal(r, i); return `<div class="set-item" style="padding:6px 0"><span>${p.me ? '★ ' : ''}${esc(p.name || `P${i + 1}`)}</span><b>${t || '-'}${t ? ` <small style="color:var(--muted);font-weight:500">(${fmtDiff(t - playedPar(r, i))})</small>` : ''}</b></div>`;
  }).join('');
}
async function saveEditor() {
  const r = ED.r;
  if (!r.date) return toast('날짜를 입력하세요');
  r.players = r.players.filter(p => p.name.trim() || p.scores.flat().some(v => v != null));

  if (!r.players.some(p => p.me)) r.players[0].me = true;
  r.players.forEach(p => p.name = p.name.trim());

  if (!r.id) { r.id = uid(); r.createdAt = now; }
  r.updatedAt = now;
  try { await DB.put(r); } catch (e) { return toast('저장 실패: ' + e.message, 4000); }
  const i = S.rounds.findIndex(x => x.id === r.id); if (i >= 0) S.rounds[i] = r; else S.rounds.push(r);
  // remember course → club mapping, and my name
  const key = r.courses.map(c => c.name).filter(Boolean).join('|');
  if (r.club && (key || r.logo)) {
    if (key) { S.clubMap[key] = r.club; r.courses.forEach(c => { if (c.name) S.clubMap[c.name] = r.club; }); }
    if (r.logo && normLogo(r.logo).length >= 3) S.clubMap['logo:' + normLogo(r.logo)] = r.club;

  }

  closeLayer();
  S.selected = r.date; S.view = 'day'; saveUi(); const d = parseYmd(r.date); S.cursor = new Date(d.getFullYear(), d.getMonth(), 1);
  render(); toast('저장했습니다');
  ED.done && ED.done('saved');
}

/* ================= OCR (scorecard image → round) ================= */
const OCR = (() => {
  const LIB = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
  let libP = null, numW = null, numW8 = null, txtW = null, logoW = null, lineW = null;
  function loadLib() {
    if (window.Tesseract) return Promise.resolve(window.Tesseract);
    return libP || (libP = new Promise((res, rej) => {
      const s = document.createElement('script'); s.src = LIB; s.async = true;
      s.onload = () => res(window.Tesseract);
      s.onerror = () => { libP = null; s.remove(); rej(new Error('인식 엔진을 불러오지 못했습니다. 첫 사용은 인터넷 연결이 필요합니다.')); };
      document.head.appendChild(s);
    }));
  }
  const withTimeout = (p, ms, msg) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(msg)), ms))]);
  async function prepare(progress) {
    const T = await loadLib();
    const log = label => m => { if (progress && m.status) progress(`${label}: ${m.status}`, m.progress); };
    if (!numW) {
      const w = await withTimeout(T.createWorker('eng', 1, { logger: log('숫자 인식기') }), 120000, '인식 엔진 준비 시간 초과 (네트워크 확인)');
      await w.setParameters({ tessedit_pageseg_mode: '7', tessedit_char_whitelist: '+-0123456789 ' });
      numW = w;
    }
    if (!numW8) { // fallback for isolated single digits that PSM 7 sometimes returns empty
      const w = await withTimeout(T.createWorker('eng', 1), 120000, '인식 엔진 준비 시간 초과 (네트워크 확인)');
      await w.setParameters({ tessedit_pageseg_mode: '8', tessedit_char_whitelist: '+-0123456789' });
      numW8 = w;
    }
    if (!txtW) {
      const w = await withTimeout(T.createWorker('kor', 1, { logger: log('한글 인식기') }), 180000, '한글 데이터 다운로드 시간 초과 (네트워크 확인)');
      await w.setParameters({ tessedit_pageseg_mode: '7' });
      txtW = w;
    }
    if (!logoW) { // English logo / wordmark (e.g. "GOLD CC")
      const w = await withTimeout(T.createWorker('eng', 1), 120000, '인식 엔진 준비 시간 초과 (네트워크 확인)');
      await w.setParameters({ tessedit_pageseg_mode: '11' });
      logoW = w;
    }
    if (!lineW) { // single English line (row labels, Latin course-name tails)
      const w = await withTimeout(T.createWorker('eng', 1), 120000, '인식 엔진 준비 시간 초과 (네트워크 확인)');
      await w.setParameters({ tessedit_pageseg_mode: '7' });
      lineW = w;
    }
  }

  /* ---- image analysis ---- */
  function loadImage(file) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file); const img = new Image();
      img.onload = () => res(img); img.onerror = () => rej(new Error('이미지를 열 수 없습니다'));
      img.src = url;
    });
  }
  const median = a => { if (!a.length) return 0; const s = a.slice().sort((x, y) => x - y); return s[s.length >> 1]; };

  function analyze(img) {
    let W = img.naturalWidth, H = img.naturalHeight;
    const sc = W > 1500 ? 1500 / W : W < 700 ? 900 / W : 1;
    W = Math.round(W * sc); H = Math.round(H * sc);
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const cx = cv.getContext('2d', { willReadFrequently: true });
    cx.fillStyle = '#fff'; cx.fillRect(0, 0, W, H); cx.drawImage(img, 0, 0, W, H);
    const D = cx.getImageData(0, 0, W, H).data, N = W * H;
    const L = new Uint8Array(N), SA = new Uint8Array(N), BL = new Uint8Array(N);
    for (let i = 0, j = 0; i < N; i++, j += 4) {
      const r = D[j], g = D[j + 1], b = D[j + 2];
      L[i] = (r * 299 + g * 587 + b * 114) / 1000;
      SA[i] = Math.max(r, g, b) - Math.min(r, g, b);
      BL[i] = (b > r + 45 && b > 100) ? 1 : 0;
    }
    const step = Math.max(1, Math.floor(W / 400)), xa = Math.floor(W * 0.03), xb = Math.floor(W * 0.97);
    const minH = Math.max(6, Math.round(W * 0.012));
    // 1) blue (header / par) rows
    const blueFrac = new Float32Array(H), medR = new Float32Array(H);
    for (let y = 0; y < H; y++) {
      let n = 0, bl = 0; const rs = [];
      for (let x = xa; x < xb; x += step) { n++; const i = y * W + x; if (BL[i]) { bl++; rs.push(D[i * 4]); } }
      blueFrac[y] = bl / n; medR[y] = median(rs);
    }
    const runs = [];
    for (let y = 0; y < H; y++) {
      if (blueFrac[y] > 0.55) {
        const last = runs[runs.length - 1];
        if (last && y - last.y1 <= 3) last.y1 = y; else runs.push({ y0: y, y1: y });
      }
    }
    const blueRuns = runs.filter(r => r.y1 - r.y0 + 1 >= minH);
    const sections = [];
    for (const run of blueRuns) {
      const vals = []; for (let y = run.y0; y <= run.y1; y++) vals.push(medR[y]);
      const lo = Math.min(...vals), hi = Math.max(...vals);
      let Hb = { y0: run.y0, y1: run.y1 }, Pb = null;
      if (hi - lo > 25) {
        const thr = (lo + hi) / 2, segs = [];
        for (let y = run.y0; y <= run.y1; y++) {
          const k = medR[y] < thr ? 'H' : 'P', last = segs[segs.length - 1];
          if (last && last.k === k) last.y1 = y; else segs.push({ k, y0: y, y1: y });
        }
        const big = segs.filter(s => s.y1 - s.y0 + 1 >= minH * 0.5);
        const hs = big.find(s => s.k === 'H');
        if (hs) { Hb = hs; Pb = big.find(s => s.k === 'P' && s.y0 > hs.y0) || null; }
      }
      sections.push({ H: Hb, P: Pb });
    }
    if (!sections.length) throw new Error('스코어 표를 찾지 못했습니다');
    // 2) per section: table x-range, columns, player rows
    const out = { W, H, L, SA, sections: [], topY: sections[0].H.y0, canvas: cv };
    sections.forEach((sec, si) => {
      const ym = Math.round((sec.H.y0 + sec.H.y1) / 2);
      let tx0 = 0, tx1 = W - 1;
      for (let x = 0; x < W; x++) if (BL[ym * W + x]) { tx0 = x; break; }
      for (let x = W - 1; x >= 0; x--) if (BL[ym * W + x]) { tx1 = x; break; }
      const band = sec.H; // columns from white text in header band (fallback: par band)
      let cols = findColumns(band, tx0, tx1);
      if (cols.holes.length < 3 && sec.P) cols = findColumns(sec.P, tx0, tx1);
      if (cols.holes.length < 3) return;
      const yA = (sec.P || sec.H).y1 + 1, yB = si + 1 < sections.length ? sections[si + 1].H.y0 - 1 : H - 1;
      const rows = findTextRows(yA, yB, tx0, tx1);
      out.sections.push({ H: sec.H, P: sec.P, tx0, tx1, ...cols, rows });
    });
    if (!out.sections.length) throw new Error('홀 번호 열을 찾지 못했습니다');
    return out;

    function findColumns(band, tx0, tx1) {
      const proj = new Uint16Array(W);
      for (let y = band.y0; y <= band.y1; y++) for (let x = tx0 + 3; x < tx1 - 3; x++) { const i = y * W + x; if (L[i] > 175 && SA[i] < 70) proj[x]++; }
      const gap = Math.max(4, Math.round(W * 0.018)), cs = [];
      let cur = null;
      for (let x = tx0 + 3; x < tx1 - 3; x++) {
        if (proj[x] > 0) { if (cur && x - cur.x1 <= gap) cur.x1 = x; else { cur = { x0: x, x1: x }; cs.push(cur); } }
      }
      cs.forEach(c => c.c = (c.x0 + c.x1) / 2);
      let best = [];
      for (let i = 0; i + 1 < cs.length; i++) {
        const pitch = cs[i + 1].c - cs[i].c; if (pitch < W * 0.025) continue;
        const run = [cs[i], cs[i + 1]];
        for (let k = i + 1; k + 1 < cs.length && Math.abs(cs[k + 1].c - cs[k].c - pitch) < pitch * 0.2; k++) run.push(cs[k + 1]);
        if (run.length > best.length) best = run;
      }
      if (best.length < 3) return { holes: [] };
      const diffs = []; for (let i = 1; i < best.length; i++) diffs.push(best[i].c - best[i - 1].c);
      const pitch = median(diffs);
      const holes = best.map(c => ({ x0: Math.round(c.c - pitch / 2), x1: Math.round(c.c + pitch / 2) }));
      return {
        holes, pitch,
        label: { x0: tx0 + Math.round(W * 0.01), x1: holes[0].x0 },
        total: { x0: holes[holes.length - 1].x1, x1: tx1 - Math.round(W * 0.006) },
      };
    }
    function findTextRows(yA, yB, tx0, tx1) {
      const isText = new Uint8Array(H); let grayRun = 0, end = yB;
      for (let y = yA; y <= yB; y++) {
        let n = 0, ink = 0; const ls = [];
        for (let x = tx0 + 4; x < tx1 - 4; x += step) { n++; const l = L[y * W + x]; if (l < 110) ink++; ls.push(l); }
        const f = ink / n;
        if (f > 0.5) { grayRun = 0; continue; } // table rule line
        if (median(ls) < 232) { if (++grayRun >= Math.max(6, minH * 0.6)) { end = y - grayRun; break; } continue; } else grayRun = 0;
        if (f > 0.002) isText[y] = 1;
      }
      const bands = [], mg = Math.max(2, Math.round(W * 0.004));
      for (let y = yA; y <= end; y++) if (isText[y]) {
        const last = bands[bands.length - 1];
        if (last && y - last.y1 <= mg) last.y1 = y; else bands.push({ y0: y, y1: y });

    x0 = Math.max(0, Math.round(x0)); x1 = Math.min(G.W - 1, Math.round(x1));
    const c = document.createElement('canvas'); c.width = x1 - x0 + 40; c.height = y1 - y0 + 1 + 40;
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
    x.drawImage(G.canvas, x0, y0, x1 - x0, y1 - y0 + 1, 20, 20, x1 - x0, y1 - y0 + 1); return { c, ox: x0 - 20 };
  };
  async function headerCols(G, b) { // → {centers[9], pitch, start} or null — each blob read on its own
    const words = [];
    for (const o of b.blobs.filter(o => o.x1 - o.x0 > 4 && o.x1 - o.x0 < G.W * 0.08)) {
      const r = await readNum(G, o.x0 - 4, o.x1 + 4, b.py0, b.py1, false);
      if (r.v != null && r.v > 0) words.push({ n: r.v, x: o.c });
    }
    for (const start of [1, 10]) {
      const f = []; const seen = new Set();
      for (const w of words) { const k = w.n - start + 1; if (k >= 1 && k <= 9 && !seen.has(k)) { seen.add(k); f.push({ k, x: w.x }); } }
      if (f.length < 6) continue;
      f.sort((a, b2) => a.x - b2.x);
      let inc = 0; for (let i = 1; i < f.length; i++) if (f[i].k > f[i - 1].k) inc++;
      if (inc < f.length - 2) continue;
      const sl = []; for (let i = 0; i < f.length; i++) for (let j = i + 1; j < f.length; j++) if (f[j].k !== f[i].k) sl.push((f[j].x - f[i].x) / (f[j].k - f[i].k));
      const pitch = median(sl); if (!(pitch > G.W * 0.035)) continue;
      const a = median(f.map(p => p.x - pitch * p.k));
      if (f.filter(p => Math.abs(a + pitch * p.k - p.x) < pitch * 0.3).length < 6) continue;
      return { centers: Array.from({ length: 9 }, (_, i) => a + pitch * (i + 1)), pitch, start };
    }
    return null;
  }
  const aligned = (b, cols) => cols.centers.filter(cx => b.blobs.some(o => Math.abs(o.c - cx) < cols.pitch * 0.35 && o.x1 - o.x0 < cols.pitch * 0.9)).length;
  async function engLine(G, x0, x1, y0, y1) {
    const cc = cellCanvas(G, x0, x1, y0, y1, false); if (!cc) return { text: '', conf: 0 };
    const { data } = await lineW.recognize(cc.canvas); return { text: (data.text || '').trim(), conf: data.confidence || 0 };
  }
  async function korConf(G, x0, x1, y0, y1) {
    const cc = cellCanvas(G, x0, x1, y0, y1, false); if (!cc) return 0;
    const { data } = await txtW.recognize(cc.canvas); return data.confidence || 0;
  }
  async function courseName(G, x0, x1, y0, y1) { // Latin ("LAKE", "Mountain") or Korean ("스톤", "챔피언IN")
    const e = await engLine(G, x0, x1, y0, y1);
    const latin = e.text.replace(/코스|course/gi, '').replace(/[^A-Za-z0-9 ]/g, ' ').split(/\s+/).filter((w, i) => w.length >= 3 || (i > 0 && SUFFIXES.includes(w.toUpperCase()))).join(' ').trim();
    if ((latin.match(/[A-Za-z]/g) || []).length >= 3 && e.conf >= 60 && /^[A-Z][A-Za-z]+( [A-Za-z0-9]+)*$/.test(latin)) return latin;
    return (await readText(G, x0, x1, y0, y1, false)).replace(/코스$/, '');
  }
  async function recognizeGeneric(img, progress) {
    const G = prepGeneric(img), bands = bandsOf(G);
    const secs = []; let cur = null;
    bands.forEach((b, i) => b.prev = bands[i - 1] || null);
    const cand = bands.filter(b => hasRun(b.blobs, G.W));
    let done = 0; const est = cand.length + bands.length * 4;
    const tick = n => progress(`표 구조 분석 중… ${Math.min(99, Math.round((done += n) / est * 100))}%`, 0.2 + 0.75 * Math.min(1, done / est));
    let prevRow = null; const gaps = [];
    for (const b of bands) {
      let cols = null;
      // a header can only start a table: first row of the image, after a non-table line, or after a larger gap
      const gap = prevRow ? b.y0 - prevRow.y1 : Infinity, typical = gaps.length ? median(gaps) : Infinity;
      if (hasRun(b.blobs, G.W) && (!cur || prevRow !== b.prev || gap > typical * 1.6)) { cols = await headerCols(G, b); tick(1); }
      if (cols) { cur = { b, cols, rows: [], idx: bands.indexOf(b) }; secs.push(cur); prevRow = b; gaps.length = 0; continue; }
      if (cur && aligned(b, cur.cols) >= 5) { cur.rows.push(b); if (prevRow) gaps.push(b.y0 - prevRow.y1); prevRow = b; }
    }
    if (!secs.length) return null;
    const out = [];
    for (const s of secs) {
      const { centers, pitch } = s.cols, lx1 = centers[0] - pitch * 0.55, tx0 = centers[8] + pitch * 0.5;
      const sec = { name: '', par: [], parTotal: null, rows: [] };
      // course name: header label, else the text line just above the header
      const hl = (await courseName(G, 0, lx1, s.b.py0, s.b.py1)).trim();
      if (hl.replace(/[^A-Za-z가-힣]/g, '').length >= 2 && !/^(h|hole|holes|홀|no)$/i.test(hl)) sec.name = hl;
      else {
        const prev = bands[s.idx - 1];
        if (prev && s.b.y0 - prev.y1 < (s.b.y1 - s.b.y0) * 3 && !secs.some(o => o.rows.includes(prev) || o.b === prev) && prev.blobs.length) {
          let x1 = prev.blobs[0].x1; for (const o of prev.blobs.slice(1)) { if (o.x0 - x1 > 40) break; x1 = o.x1; }
          sec.name = (await courseName(G, Math.max(0, prev.blobs[0].x0 - 6), x1 + 6, prev.py0, prev.py1)).trim();
        }
      }
      for (const b of s.rows) {
        const lab = (await engLine(G, 0, lx1, b.py0, b.py1)).text; tick(1);
        if (/h\s*d\s*c\s*p|hcp|handi/i.test(lab) || /p\s*u\s*t/i.test(lab)) continue;
        const isPar = /p\s*a\s*r/i.test(lab);
        const vals = [], fail = [];
        for (const cx of centers) { const r = await readNum(G, cx - pitch * 0.42, cx + pitch * 0.42, b.py0, b.py1, false); vals.push(r.v); fail.push(!!r.fail); }
        const t = await readNum(G, tx0, G.W - 1, b.py0, b.py1, false); tick(3);
        if (isPar || (!sec.par.length && !sec.rows.length && vals.every(v => v >= 3 && v <= 6))) { sec.par = vals; sec.parTotal = t.all ? t.all[0] : null; continue; }
        const name = await readText(G, 0, lx1, b.py0, b.py1, false);
        if (/^(파|핸디|퍼트|퍼팅)$/.test(name)) continue;
        sec.rows.push({ name, vals, fail, total: t.all ? t.all[0] : null });
      }
      if (!sec.par.length) sec.par = centers.map(() => null);
      if (sec.rows.length) out.push(sec);
    }
    if (!out.length) return null;
    // date / time / club from everything above the first table
    const topY = Math.max(0, (bands[secs[0].idx - 1] && !secs[0].name ? bands[secs[0].idx - 1].y0 : secs[0].b.y0) - 4);
    let top = {}, club = null;
    if (topY > 30) {
      const c = document.createElement('canvas'); c.width = G.W; c.height = topY;
      c.getContext('2d').drawImage(G.color, 0, 0, G.W, topY, 0, 0, G.W, topY);
      const { data } = await logoW.recognize(c); top = parseTop(data.text || '');
      const names = new Set(out.flatMap(s => s.rows.map(r => normName(r.name))));
      const lines = (data.lines || []).map(l => ({ t: l.text.replace(/[^A-Za-z0-9&' .\-]/g, ' ').replace(/\s+/g, ' ').trim(), h: l.bbox.y1 - l.bbox.y0, conf: l.confidence }))
        .filter(l => (l.t.match(/[A-Za-z]/g) || []).length >= 3 && l.conf >= 50 && !/\d/.test(l.t) && !/score|card|team|date|tee|off|name|par|total/i.test(l.t) && !/^(golf|resort|country club|the)$/i.test(l.t));
      lines.sort((a, b) => b.h - a.h || b.conf - a.conf);
      // Korean club name line (e.g. "안성H"), skipping player names
      await txtW.setParameters({ tessedit_pageseg_mode: '11' });
      try {
        const kd = (await txtW.recognize(c)).data;
        const kl = (kd.lines || []).map(l => ({ t: l.text.replace(/\s+/g, '').replace(/[^가-힣A-Za-z0-9]/g, ''), h: l.bbox.y1 - l.bbox.y0, conf: l.confidence }))
          .filter(l => /[가-힣]{2,}/.test(l.t) && l.conf >= 45 && l.t.length <= 12 && !names.has(normName(l.t)) && !/\d/.test(l.t) && !/스코어|카드|날짜|이름|코스|캐디|소요|시간|구름|맑음|흐림|비/.test(l.t));
        kl.sort((a, b) => b.h - a.h || b.conf - a.conf);
        if (kl[0]) club = { text: kl[0].t, conf: kl[0].conf };
      } finally { await txtW.setParameters({ tessedit_pageseg_mode: '7' }); }
      if (!club && lines[0]) club = { text: lines[0].t, conf: lines[0].conf };
    }
    return { top, logo: club, sections: out };
  }

  async function recognize(file, progress) {
    progress('이미지 분석 중…', 0.02);
    const img = await loadImage(file);
    const image = shrinkImage(img);
    progress('인식 엔진 준비 중… (첫 사용 시 다운로드)', 0.05);
    await prepare((m, f) => progress(m, 0.05 + (f || 0) * 0.15));
    let A = null;
    try { A = analyze(img); } catch (e) { A = null; }
    // SMARTSCORE-style cards (blue header + PAR band) use the tuned reader; everything else the generic one
    if (!A || !A.sections.some(s => s.P)) {
      const g = await recognizeGeneric(img, progress);
      if (g) return { image, ...g };
      if (!A) return { image, error: '스코어 표를 찾지 못했습니다' };
    }
    const secs = A.sections, totalCells = secs.reduce((s, x) => s + (x.rows.length + 1) * (x.holes.length + 2), 0) + 1;
    let done = 0; const tick = () => progress(`스코어 읽는 중… ${Math.round(++done / totalCells * 100)}%`, 0.2 + 0.8 * done / totalCells);
    const top = parseTop(await readTop(A)); tick();
    let logo = null; try { logo = await readLogo(A); } catch (e) {}
    const R = [];
    for (const s of secs) {
      const sec = { name: '', par: [], parTotal: null, rows: [] };
      sec.name = await readText(A, s.label.x0, s.label.x1, s.H.y0, s.H.y1, true); tick();
      if (s.P) {
        for (const hc of s.holes) { const r = await readNum(A, hc.x0, hc.x1, s.P.y0, s.P.y1, true); sec.par.push(r.v); tick(); }
        const t = await readNum(A, s.total.x0, s.total.x1, s.P.y0, s.P.y1, true); sec.parTotal = t.v; tick();
      } else { sec.par = s.holes.map(() => null); done += s.holes.length + 1; }
      for (const row of s.rows) {
        const pr = { name: '', vals: [], fail: [], total: null };
        pr.name = await readText(A, s.label.x0, s.label.x1, row.y0, row.y1, false); tick();
        for (const hc of s.holes) { const r = await readNum(A, hc.x0, hc.x1, row.y0, row.y1, false); pr.vals.push(r.v); pr.fail.push(!!r.fail); tick(); }
        const t = await readNum(A, s.total.x0, s.total.x1, row.y0, row.y1, false); pr.total = t.all ? t.all[0] : null; tick();
        sec.rows.push(pr);
      }
      R.push(sec);
    }
    return { image, top, logo, sections: R };
  }

  /* convert recognition result → editable round */
  function toRound(res, fallbackDate, myName) {
    const r = { id: null, date: res.top?.date || fallbackDate, time: res.top?.time || '', club: '', memo: '', image: res.image, logo: res.logo?.text || '', courses: [], players: [] };
    const warn = [], notes = [], card = [], parNotes = [];
    if (!res.sections || !res.sections.length) {
      notes.push('⚠️ ' + (res.error || '스코어 표를 인식하지 못했습니다') + ' — 직접 입력해 주세요.');
      const b = blankRound(); b.image = res.image; b.date = r.date; return { r: b, warn, notes, card: null };
    }
    // course & par
    res.sections.forEach((s, ci) => {
      const name = s.name.replace(/^(코스|COURSE)/i, '');
      const par = s.par.map((v, h) => { if (v >= 3 && v <= 6) return v; warn.push(`${ci}-par-${h}`); return 4; });
      r.courses.push({ name, par });
      if (s.parTotal && sum(par) !== s.parTotal) parNotes.push(`⚠️ ${name || `코스${ci + 1}`} PAR 합계가 카드(${s.parTotal})와 다릅니다 (${sum(par)})`);
    });
    // decide relative (+/-) vs absolute strokes by voting with card totals
    let rel = 0, abs = 0;
    res.sections.forEach((s, ci) => s.rows.forEach(p => {
      if (p.total == null) return; const vs = sum(p.vals), ps = sum(r.courses[ci].par);
      if (vs + ps === p.total) rel++; else if (vs === p.total) abs++;
    }));
    if (!rel && !abs) {
      const all = res.sections.flatMap(s => s.rows.flatMap(p => p.vals)).filter(v => v != null);
      rel = all.length && (sum(all) / all.length) < 2.6 ? 1 : 0; abs = rel ? 0 : 1;
    }
    const isRel = rel >= abs;
    const np = Math.max(...res.sections.map(s => s.rows.length));
    const mine = normName(myName);
    for (let pi = 0; pi < np; pi++) {
      const name = res.sections.map(s => s.rows[pi]?.name).find(Boolean) || '';
      r.players.push({ name, me: false, scores: [] });
    }
    res.sections.forEach((s, ci) => {
      card[ci] = [];
      for (let pi = 0; pi < np; pi++) {
        const p = s.rows[pi], par = r.courses[ci].par;
        const sc = par.map((pv, h) => {
          if (!p) return null; const v = p.vals[h];
          if (v == null) { if (p.fail[h]) warn.push(`${ci}-${pi}-${h}`); return null; }
          const st = isRel ? pv + v : v;
          if (st < 1 || st > 15) { warn.push(`${ci}-${pi}-${h}`); return null; }
          return st;
        });
        r.players[pi].scores[ci] = sc;
        card[ci][pi] = p && p.total != null && p.total > 0 ? p.total : null;
      }
    });
    let mi = mine ? r.players.findIndex(p => normName(p.name) && (normName(p.name) === mine || normName(p.name).includes(mine) || mine.includes(normName(p.name)))) : -1;
    if (mi < 0 && mine) { // one misread syllable ("구차윤") still counts as me; fix the name
      let best = 0; r.players.forEach((p, i) => { const sm = similarity(normName(p.name), mine); if (sm > best) { best = sm; mi = i; } });
      if (best >= 0.6) r.players[mi].name = myName; else mi = -1;
    }
    if (mi < 0) mi = 0;
    if (r.players[mi]) r.players[mi].me = true;
    // club name: 1) remembered logo (fuzzy)  2) remembered course pair  3) logo text as read  4) single course name
    const key = r.courses.map(c => c.name).filter(Boolean).join('|');
    let clubSrc = '';
    const lg = normLogo(r.logo);
    if (lg.length >= 3) {
      let best = 0, bestClub = '';
      for (const k in S.clubMap) if (k.startsWith('logo:')) { const sm = similarity(lg, k.slice(5)); if (sm > best) { best = sm; bestClub = S.clubMap[k]; } }
      if (best >= 0.6) { r.club = bestClub; clubSrc = 'memo'; }
    }
    if (!r.club && key && S.clubMap[key]) { r.club = S.clubMap[key]; clubSrc = 'memo'; }
    if (!r.club && r.logo) { r.club = r.logo; clubSrc = 'logo'; }
    if (!r.club) { r.club = r.courses.map(c => S.clubMap[c.name]).find(Boolean) || ''; if (r.club) clubSrc = 'memo'; }
    let bad = 0;
    card.forEach((cs, ci) => cs.forEach((t, pi) => { if (t != null && sum(r.players[pi].scores[ci]) !== t) bad++; }));
    notes.unshift(bad || warn.length
      ? `인식 결과를 확인해 주세요. 카드 합계와 다른 줄 ${bad}개, 확인 필요한 칸 ${warn.length}개가 표시되어 있습니다.`
      : '✓ 모든 줄의 합계가 스코어카드와 일치합니다. 골프장명·날짜만 확인 후 저장하세요.');
    if (bad) notes.push(...parNotes); // a misread PAR total only matters when the rows don't add up
    if (!res.top?.date) notes.push('⚠️ 날짜를 읽지 못해 선택한 날짜로 설정했습니다.');
    if (clubSrc === 'logo') notes.push(`골프장명은 로고에서 읽은 "${r.logo}"입니다. 원하는 이름(예: 한글)으로 고쳐 저장하면 다음부터 같은 로고는 그 이름으로 입력됩니다.`);
    if (!r.club) notes.push('골프장명을 입력하면 다음부터 같은 로고·코스명으로 자동 입력됩니다.');
    notes.ok = !bad && !warn.length;
    return { r, warn, notes, card, mode: isRel ? 'rel' : 'abs' };
  }
  return { prepare, recognize, toRound, _dbg: { analyze, cellCanvas, readNum, loadImage, prepGeneric, bandsOf, hasRun, headerCols, recognizeGeneric, w: () => numW, w8: () => numW8 } };
})();

async function recognizeFile(f, progress) {
  try {
    const res = await OCR.recognize(f, progress);
    const x = OCR.toRound(res, S.selected, S.settings.myName);
    return { r: x.r, opts: { warn: x.warn, notes: x.notes, card: x.card, mode: x.mode } };
  } catch (err) {
    const b = blankRound();
    try {
      const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = URL.createObjectURL(f); });
      b.image = shrinkImage(img);
    } catch (_) {}
    return { r: b, opts: { notes: [`⚠️ ${err.message} — 직접 입력해 주세요.`] } };
  }
}
$('#fileIn').onchange = async e => {
  const files = [...e.target.files]; if (!files.length) return;
  const n = files.length; let pg = null, saved = 0;
  // recognise cards one after another in the background while the user reviews the previous one
  let chain = Promise.resolve();
  const jobs = files.map((f, i) => chain = chain.then(() => recognizeFile(f, (m, fr) => pg && pg.set(n > 1 ? `${i + 1}/${n}장 · ${m}` : m, fr))));
  for (let i = 0; i < n; i++) {
    let x = await Promise.race([jobs[i], Promise.resolve(null)]); // already recognised?
    if (!x) { pg = showProgress(n > 1 ? `스코어카드 인식 (${i + 1}/${n})` : '스코어카드 인식'); x = await jobs[i]; pg.close(); pg = null; }
    const dup = x.r.time && S.rounds.find(o => o.date === x.r.date && o.time === x.r.time);
    if (dup) { x.opts.notes = x.opts.notes || []; x.opts.notes.unshift(`⚠️ ${x.r.date} ${x.r.time} 기록이 이미 있습니다. 같은 카드라면 ${i + 1 < n ? '건너뛰기' : '취소'}를 누르세요.`); x.opts.notes.ok = false; }
    const result = await openEditor(x.r, { ...x.opts, tag: n > 1 ? ` (${i + 1}/${n})` : '', remaining: n - i - 1 });
    if (result === 'saved') saved++;
  }
  if (n > 1) toast(`${n}장 중 ${saved}건을 저장했습니다`, 3000);
};

/* ================= boot ================= */
(async () => {
  await loadAll();
  render();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
window.GolfApp = { S, OCR, DB };
